<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas SECU — Espace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --page-bg:#ffffff;--ink:#2a2f33;--dim:#6a7278;--accent:#8b1e1e;
      --accent-soft:rgba(139,30,30,.07);--paper:#fff;--grid:rgba(47,111,115,.035);
      --shadow:rgba(47,111,115,.08);--teal:#2f6f73;--hairline:#e4e7e5;
      --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
    }
    body{
      margin:0;min-height:100vh;color:var(--ink);line-height:1.55;
      font-family:var(--sans);
      background:
        linear-gradient(180deg,#ffffff 0%,#fbfcfc 48%,#f7faf9 100%),
        repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 28px),
        repeating-linear-gradient(90deg,transparent 0 27px,var(--grid) 27px 28px),
        var(--page-bg);
    }
    .wrap{max-width:740px;margin:0 auto;padding:9vh 24px 56px}
    .admin-badge{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      margin:0 0 24px;padding:14px 16px;
      background:var(--paper);border:1px solid var(--hairline);
      box-shadow:0 1px 0 var(--shadow);
    }
    .admin-badge .stamp{
      display:inline-flex;align-items:center;gap:8px;
      padding:5px 10px;border:2px solid var(--accent);color:var(--accent);
      font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      background:var(--accent-soft);
    }
    .admin-badge .stamp::before{
      content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 0 3px rgba(139,30,30,.18);
    }
    .admin-badge .who{
      font-family:var(--mono);font-size:.85rem;letter-spacing:.04em;font-weight:600;
    }
    .admin-badge .meta{
      margin-left:auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim);
    }
    #content{font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em}
    .nav{margin-top:28px;font-size:.95rem}
    .nav a{color:var(--teal);margin-right:14px;text-underline-offset:3px}
    .nav a:hover{color:#3d8185}
    #admin-session-badge[hidden],#content[hidden],#nav[hidden]{display:none!important}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="admin-session-badge" class="admin-badge" hidden role="status" aria-live="polite">
      <span class="stamp">Session administrateur</span>
      <span class="who" id="admin-session-name"></span>
      <span class="meta">SECU · RoE A</span>
    </div>
    <div id="content" hidden>1 2 3 4</div>
    <p class="nav" id="nav" hidden>
      <a href="/">Accueil</a>
      <a href="#" id="logout">Déconnexion</a>
    </p>
  </div>
  <script src="/auth.js"></script>
  <script>
    (function () {
      var session = AtlasAuth.requireSession('/');
      if (!session) return;
      document.getElementById('admin-session-badge').hidden = false;
      document.getElementById('admin-session-name').textContent = session.firstName || 'Utilisateur';
      document.getElementById('content').hidden = false;
      document.getElementById('nav').hidden = false;
      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        AtlasAuth.logout();
        location.replace('/');
      });
    })();
  </script>
</body>
</html>
