<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas — Espace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --page-bg:#f4f8fa;--ink:#2a3d45;--dim:#6b818a;--accent:#b23a3a;
      --accent-soft:rgba(178,58,58,.08);--paper:#fff;--grid:rgba(42,61,69,.05);
      --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
    }
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
    body{
      margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);line-height:1.45;
      font-family:var(--sans);overflow-x:hidden;
      background:
        linear-gradient(180deg,rgba(255,255,255,.72),rgba(244,248,250,.94)),
        repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
        repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),
        var(--page-bg);
    }
    .wrap{max-width:720px;margin:0 auto;padding:8vh 20px calc(48px + env(safe-area-inset-bottom,0px))}
    .session-badge{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      margin:0 0 22px;padding:12px 14px;min-height:44px;
      background:var(--paper);border:1px solid rgba(42,61,69,.22);
      box-shadow:3px 3px 0 rgba(42,61,69,.06);
    }
    .session-badge .stamp{
      display:inline-flex;align-items:center;gap:8px;min-height:36px;
      padding:8px 12px;border:2px solid var(--accent);color:var(--accent);
      font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      background:var(--accent-soft);
    }
    .session-badge .stamp::before{
      content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 0 3px rgba(178,58,58,.18);
    }
    .session-badge .who{
      font-family:var(--mono);font-size:.85rem;letter-spacing:.04em;font-weight:600;
    }
    .session-badge .meta{
      margin-left:auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim);
    }
    #content{font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em;overflow-wrap:anywhere}
    .nav{margin-top:24px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px 12px}
    .nav a{
      color:var(--ink);display:inline-flex;align-items:center;
      min-height:44px;padding:8px 4px;text-decoration:underline;
    }
    #session-badge[hidden],#content[hidden],#nav[hidden]{display:none!important}
    @media (max-width:640px){
      .wrap{padding:6vh 16px calc(40px + env(safe-area-inset-bottom,0px))}
      .session-badge .meta{margin-left:0;width:100%}
      #content{font-size:1rem;letter-spacing:.04em}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="session-badge" class="session-badge" hidden role="status" aria-live="polite">
      <span class="stamp" id="session-role-stamp">—</span>
      <span class="who" id="session-name"></span>
      <span class="meta" id="session-clearance">RoE</span>
    </div>
    <div id="content" hidden>1 2 3 4</div>
    <p class="nav" id="nav" hidden>
      <a href="/">Accueil</a>
      <span id="pragma-product-links" hidden></span>
      <a href="#" id="logout">Déconnexion</a>
    </p>
  </div>
  <script src="/auth.js"></script>
  <script>
    (function () {
      var session = AtlasAuth.requireSession('/');
      if (!session) return;
      var role = AtlasAuth.resolveRole(session);
      document.getElementById('session-badge').hidden = false;
      document.getElementById('session-name').textContent = session.firstName || 'Utilisateur';
      document.getElementById('session-role-stamp').textContent = (role && role.post) || 'Session';
      document.getElementById('session-clearance').textContent =
        role ? ('Clearance ' + role.clearance) : 'RoE';
      document.getElementById('content').hidden = false;
      document.getElementById('nav').hidden = false;
      var pragmaLinks = document.getElementById('pragma-product-links');
      if (pragmaLinks && AtlasAuth.canSeePragmaProductLinks(session)) {
        [
          { href: 'https://pragma-serve.com', label: 'PragmaServe' },
          { href: 'https://pragma-cloud.com', label: 'PragmaCloud' },
          { href: 'https://pragma.mc', label: 'PragmaUC' }
        ].forEach(function (item) {
          var a = document.createElement('a');
          a.href = item.href;
          a.rel = 'noopener noreferrer';
          a.target = '_blank';
          a.textContent = item.label;
          a.style.marginRight = '12px';
          pragmaLinks.appendChild(a);
        });
        pragmaLinks.hidden = false;
      }
      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        AtlasAuth.logout();
        location.replace('/');
      });
    })();
  </script>
</body>
</html>
