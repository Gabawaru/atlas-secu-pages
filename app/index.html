<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — Espace</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:10vh auto;padding:0 20px;color:#111;line-height:1.45}
    .nav{margin-top:24px;font-size:0.95rem}
    .nav a{color:#111;margin-right:12px}
  </style>
</head>
<body>
  <div id="content" hidden>1 2 3 4</div>
  <p class="nav" id="nav" hidden>
    <a href="/">Accueil</a>
    <a href="#" id="logout">Déconnexion</a>
  </p>
  <script src="/auth.js"></script>
  <script>
    (function () {
      var session = AtlasAuth.requireSession('/login/');
      if (!session) return;
      document.getElementById('content').hidden = false;
      document.getElementById('nav').hidden = false;
      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        AtlasAuth.logout();
        location.replace('/login/');
      });
    })();
  </script>
</body>
</html>
