<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — Espace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --page-bg:#f7f7f5;--ink:#111;--dim:#6b6b6b;--accent:#8b1e1e;
      --accent-soft:rgba(139,30,30,.08);--paper:#fff;--grid:rgba(22,22,22,.045);
      --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
    }
    body{
      margin:0;min-height:100vh;color:var(--ink);line-height:1.45;
      font-family:var(--sans);
      background:
        linear-gradient(180deg,rgba(255,255,255,.65),rgba(247,247,245,.92)),
        repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
        repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),
        var(--page-bg);
    }
    .wrap{max-width:720px;margin:0 auto;padding:8vh 20px 48px}
    .admin-badge{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      margin:0 0 22px;padding:12px 14px;
      background:var(--paper);border:1px solid var(--ink);
      box-shadow:3px 3px 0 rgba(17,17,17,.08);
    }
    .admin-badge .stamp{
      display:inline-flex;align-items:center;gap:8px;
      padding:5px 10px;border:2px solid var(--accent);color:var(--accent);
      font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      background:var(--accent-soft);
    }
    .admin-badge .stamp::before{
      content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 0 3px rgba(139,30,30,.18);
    }
    .admin-badge .who{
      font-family:var(--mono);font-size:.85rem;letter-spacing:.04em;font-weight:600;
    }
    .admin-badge .meta{
      margin-left:auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim);
    }
    #content{font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em}
    .nav{margin-top:24px;font-size:.95rem}
    .nav a{color:var(--ink);margin-right:12px}
    #admin-session-badge[hidden],#content[hidden],#nav[hidden]{display:none!important}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="admin-session-badge" class="admin-badge" hidden role="status" aria-live="polite">
      <span class="stamp">Session administrateur</span>
      <span class="who" id="admin-session-name"></span>
      <span class="meta">RoE</span>
    </div>
    <div id="content" hidden>1 2 3 4</div>
    <p class="nav" id="nav" hidden>
      <a href="/">Accueil</a>
      <span id="pragma-product-links" hidden></span>
      <a href="#" id="logout">Déconnexion</a>
    </p>
  </div>
  <script src="/auth.js"></script>
  <script>
    (function () {
      var session = AtlasAuth.requireSession('/');
      if (!session) return;
      document.getElementById('admin-session-badge').hidden = false;
      document.getElementById('admin-session-name').textContent = session.firstName || 'Utilisateur';
      document.getElementById('content').hidden = false;
      document.getElementById('nav').hidden = false;
      var pragmaLinks = document.getElementById('pragma-product-links');
      if (pragmaLinks && AtlasAuth.canSeePragmaProductLinks(session)) {
        [
          { href: 'https://pragma-serve.com', label: 'PragmaServe' },
          { href: 'https://pragma-cloud.com', label: 'PragmaCloud' },
          { href: 'https://pragma.mc', label: 'PragmaUC' }
        ].forEach(function (item) {
          var a = document.createElement('a');
          a.href = item.href;
          a.rel = 'noopener noreferrer';
          a.target = '_blank';
          a.textContent = item.label;
          a.style.marginRight = '12px';
          pragmaLinks.appendChild(a);
        });
        pragmaLinks.hidden = false;
      }
      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        AtlasAuth.logout();
        location.replace('/');
      });
    })();
  </script>
</body>
</html>
