<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — Test</title>
  <style>
    :root {
      --bg: #f4f8fa;
      --ink: #2a3d45;
      --muted: #6b818a;
      --accent: #b23a3a;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      color: var(--ink);
      background: var(--bg);
    }
    main { text-align: center; padding: 24px; }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    p {
      margin: 0;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Atlas</h1>
    <p>test</p>
  </main>
</body>
</html>
