<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --page-bg:#f7f7f5;--ink:#111;--dim:#6b6b6b;--hairline:#cfcfc9;--accent:#8b1e1e;
      --grid:rgba(22,22,22,.045);
      --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
    }
    body{
      margin:0;min-height:100vh;color:var(--ink);line-height:1.45;font-family:var(--sans);
      background:
        linear-gradient(180deg,rgba(255,255,255,.65),rgba(247,247,245,.92)),
        repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
        repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),
        var(--page-bg);
    }
    .wrap{max-width:420px;margin:0 auto;padding:10vh 20px 48px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .brand img{width:48px;height:48px;object-fit:cover;border:1px solid var(--ink);background:#fff}
    h1{margin:0;font-family:var(--mono);font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase}
    .lede{margin:8px 0 0;color:var(--dim);font-family:var(--mono);font-size:.75rem;letter-spacing:.04em}
    label{display:block;margin-top:14px;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    input{
      width:100%;box-sizing:border-box;margin-top:6px;padding:10px 12px;
      border:1px solid var(--hairline);border-radius:0;font-family:var(--mono);font-size:.9rem;background:#fafaf8;
    }
    input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.06)}
    button{
      margin-top:18px;padding:12px 20px;background:var(--ink);color:#fff;border:1px solid var(--ink);
      border-radius:0;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
    }
    .err{margin-top:14px;color:var(--accent);font-family:var(--mono);font-size:.85rem}
    .nav{margin-top:24px;font-size:.95rem}
    .nav a{color:var(--ink)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/assets/atlas-logo-final-animated.gif" alt="" width="48" height="48"
           onerror="this.onerror=null;this.src='/assets/atlas-logo-final-static.jpg'">
      <div>
        <h1>Connexion</h1>
        <p class="lede">Accès réservé aux emails autorisés.</p>
      </div>
    </div>
    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="vous@atlas-secu.com">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
      <p id="error" class="err" hidden></p>
    </form>
    <p class="nav"><a href="/">← Retour</a></p>
  </div>
  <script src="/auth.js"></script>
  <script>
    (function () {
      if (AtlasAuth.getSession()) {
        location.replace('/app/');
        return;
      }
      var form = document.getElementById('login-form');
      var err = document.getElementById('error');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.hidden = true;
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var result = AtlasAuth.login(email, password);
        if (!result.ok) {
          if (result.reason === 'unauthorized_email') {
            err.textContent = 'Email non autorisé.';
          } else if (result.reason === 'bad_password') {
            err.textContent = 'Mot de passe incorrect.';
          } else {
            err.textContent = 'Connexion impossible (stockage navigateur).';
          }
          err.hidden = false;
          return;
        }
        location.replace('/app/');
      });
    })();
  </script>
</body>
</html>
