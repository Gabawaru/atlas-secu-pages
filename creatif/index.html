<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas — Créatif</title>
  <meta name="description" content="Atlas — moodboard créatif. Document clinique.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Calm sterile lab — soft paper, warm liminal cue (not horror) */
      --paper: #f4f2ea;
      --paper-deep: #ebe6d8;
      --warm: #e4dcc4;
      --ink: #1c2426;
      --ink-soft: #3d4a4e;
      --muted: #6a7578;
      --stamp: #1f6f6b;
      --rule: rgba(28, 36, 38, 0.18);
      --accent-line: rgba(31, 111, 107, 0.28);
      --display: "Archivo Black", "Arial Black", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--mono);
      background: var(--paper-deep);
      overflow-x: hidden;
    }

    /* Soft field — sterile paper + subtle liminal depth cue */
    .field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 60% at 50% 18%, rgba(255, 255, 252, 0.7), transparent 62%),
        radial-gradient(ellipse 70% 50% at 50% 88%, rgba(212, 200, 160, 0.22), transparent 65%),
        linear-gradient(165deg, #faf8f2 0%, var(--paper) 45%, var(--warm) 100%);
    }

    /* Quiet perspective grid — moodboard liminal, not corridor horror */
    .field::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        linear-gradient(var(--accent-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 42%, #000 15%, transparent 72%);
      animation: grid-drift 36s linear infinite;
    }

    /* Soft lab light wash */
    .field::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 250, 0.85), transparent);
      box-shadow: 0 12px 48px 8px rgba(255, 252, 240, 0.35);
      animation: light-breathe 8s ease-in-out infinite;
    }

    @keyframes grid-drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 24px, 24px 48px; }
    }
    @keyframes light-breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .doc-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(28, 36, 38, 0.035) 28px
        ),
        rgba(255, 253, 248, 0.92);
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(-8px);
      animation: rise 0.7s var(--ease) 0.06s forwards;
    }

    .doc-meta {
      display: grid;
      gap: 4px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .doc-meta strong {
      color: var(--stamp);
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .stamp {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--stamp);
      border: 1.5px solid var(--stamp);
      padding: 6px 10px;
      align-self: center;
      opacity: 0;
      animation: stamp-in 0.5s var(--ease) 0.45s forwards;
    }

    .links {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .mono-link {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink-soft);
      border-bottom: 1px solid transparent;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .mono-link:hover {
      color: var(--stamp);
      border-color: var(--stamp);
    }

    .hero {
      display: grid;
      place-items: center;
      text-align: center;
      gap: clamp(16px, 3.5vh, 28px);
      padding: clamp(20px, 5vh, 48px) 12px;
    }

    .mark-wrap {
      width: min(36vw, 200px);
      aspect-ratio: 1;
      opacity: 0;
      transform: scale(0.92) translateY(14px);
      animation: rise 0.9s var(--ease) 0.18s forwards;
      filter: drop-shadow(0 6px 16px rgba(28, 36, 38, 0.1));
    }
    .mark-svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .mark-svg .frame { stroke: var(--ink); stroke-width: 7; fill: none; stroke-linejoin: round; }
    .mark-svg .inner { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linejoin: round; }
    .mark-svg .orbit {
      stroke: var(--stamp);
      stroke-width: 2.2;
      fill: none;
      opacity: 0.85;
      transform-origin: 60px 62px;
      animation: orbit-spin 14s linear infinite;
    }
    .mark-svg .orbit.alt { animation-duration: 18s; animation-direction: reverse; opacity: 0.5; }
    .mark-svg .link { stroke: var(--stamp); stroke-width: 2; fill: none; opacity: 0.8; }
    .mark-svg .node { fill: var(--stamp); }

    @keyframes orbit-spin { to { transform: rotate(360deg); } }

    .brand {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.6rem, 20vw, 10rem);
      letter-spacing: 0.12em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 0.95s var(--ease) 0.28s forwards;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.85s var(--ease) 0.42s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: var(--ink);
      border: 1.5px solid var(--ink);
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .cta:hover {
      transform: translateY(-2px);
      background: var(--stamp);
      border-color: var(--stamp);
    }
    .cta.ghost {
      color: var(--ink);
      background: rgba(255, 253, 248, 0.9);
      border-color: var(--ink);
    }
    .cta.ghost:hover {
      color: #fff;
      background: var(--ink);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid var(--rule);
      border-top-width: 2px;
      opacity: 0;
      animation: rise 0.7s var(--ease) 0.55s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes stamp-in {
      from { opacity: 0; transform: scale(1.06); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      .mark-wrap { width: min(48vw, 160px); }
      .brand { letter-spacing: 0.08em; }
      .cta-row { width: 100%; max-width: 320px; flex-direction: column; }
      .cta { width: 100%; }
      .doc-bar { flex-direction: column; }
      .stamp { align-self: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .field::before,
      .field::after,
      .mark-svg .orbit,
      .doc-bar,
      .stamp,
      .mark-wrap,
      .brand,
      .cta-row,
      .foot { animation: none !important; }
      .doc-bar, .stamp, .mark-wrap, .brand, .cta-row, .foot {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div class="stage">
    <header class="doc-bar">
      <div class="doc-meta">
        <strong>Document clinique</strong>
        <span>Ref · ATLAS / CREATIF</span>
      </div>
      <span class="stamp" aria-hidden="true">Moodboard</span>
      <nav class="links" aria-label="Navigation">
        <a class="mono-link" href="/">Atlas</a>
        <a class="mono-link" href="/#download">Télécharger</a>
      </nav>
    </header>

    <main class="hero" aria-label="Atlas">
      <div class="mark-wrap" aria-hidden="true">
        <svg class="mark-svg" viewBox="0 0 120 120">
          <path class="frame" d="M60 14 L102 98 H18 Z"/>
          <ellipse class="orbit" cx="60" cy="62" rx="34" ry="22"/>
          <ellipse class="orbit alt" cx="60" cy="62" rx="22" ry="34"/>
          <path class="inner" d="M60 48 L84 90 H36 Z"/>
          <path class="link" d="M42 58 L78 58 L60 88 Z"/>
          <circle class="node n1" cx="42" cy="58" r="4.2"/>
          <circle class="node n2" cx="78" cy="58" r="4.2"/>
          <circle class="node n3" cx="60" cy="88" r="4.2"/>
        </svg>
      </div>
      <h1 class="brand">Atlas</h1>
      <div class="cta-row">
        <a class="cta" href="/">Entrer</a>
        <a class="cta ghost" href="/#download">Télécharger</a>
      </div>
    </main>

    <footer class="foot">
      <span>Lab · créatif</span>
      <span>atlas-secu.com</span>
    </footer>
  </div>
</body>
</html>
