<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas — Créatif</title>
  <meta name="description" content="Atlas — expérience visuelle créative.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Backrooms damp yellow — stained linoleum / wet plaster */
      --damp: #c9b85a;
      --damp-deep: #9a8a3c;
      --damp-wet: #b5a44a;
      --plaster: #d4c978;
      --floor: #a8943e;
      --fluo: #e8e2b0;
      --fluo-dim: rgba(232, 226, 176, 0.35);
      /* Clinical document */
      --paper: #f3f1e8;
      --ink: #1a1a18;
      --ink-soft: #3a3a34;
      --stamp: #1f4a3a;
      --rule: rgba(26, 26, 24, 0.28);
      --danger: #8b1e1e;
      --display: "Archivo Black", "Arial Black", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--mono);
      background: var(--damp-deep);
      overflow-x: hidden;
    }

    /* —— Full-bleed liminal corridor —— */
    .corridor {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 50% 18%, var(--fluo-dim), transparent 70%),
        linear-gradient(180deg, #8f8240 0%, var(--damp) 38%, var(--floor) 72%, #6e5f28 100%);
      perspective: 900px;
      perspective-origin: 50% 42%;
    }

    .corridor-depth {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 140vmax;
      height: 140vmax;
      transform: translateX(-50%) rotateX(58deg);
      transform-origin: 50% 0%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent calc(12% - 1px),
          rgba(90, 78, 28, 0.22) calc(12% - 1px),
          rgba(90, 78, 28, 0.22) 12%
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent calc(10% - 1px),
          rgba(70, 60, 20, 0.18) calc(10% - 1px),
          rgba(70, 60, 20, 0.18) 10%
        ),
        linear-gradient(180deg, var(--plaster), var(--damp-wet) 55%, var(--floor));
      opacity: 0.92;
      animation: depth-breathe 14s var(--ease) infinite alternate;
    }

    .walls {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(70, 58, 18, 0.72) 0%, transparent 18%, transparent 82%, rgba(70, 58, 18, 0.72) 100%),
        linear-gradient(180deg, rgba(110, 98, 40, 0.35) 0%, transparent 28%);
      pointer-events: none;
    }

    /* Moisture stains */
    .stain {
      position: absolute;
      border-radius: 60% 40% 55% 45%;
      background: radial-gradient(ellipse at 40% 30%, rgba(90, 78, 30, 0.35), transparent 70%);
      filter: blur(1px);
      pointer-events: none;
    }
    .stain.a { width: 38vw; height: 28vh; left: -4%; top: 12%; opacity: 0.7; }
    .stain.b { width: 28vw; height: 22vh; right: -2%; top: 38%; opacity: 0.55; }
    .stain.c { width: 42vw; height: 18vh; left: 28%; bottom: 8%; opacity: 0.45; }

    /* Fluorescent strip + flicker */
    .fluo-bar {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 6%;
      height: 10px;
      background: linear-gradient(180deg, #f5f1d0, #cfc88a);
      box-shadow:
        0 0 40px 12px rgba(232, 226, 176, 0.45),
        0 0 90px 28px rgba(200, 190, 110, 0.2);
      animation: fluo-flicker 5.5s steps(1, end) infinite;
    }

    @keyframes fluo-flicker {
      0%, 100% { opacity: 1; }
      47% { opacity: 1; }
      48% { opacity: 0.55; }
      49% { opacity: 1; }
      72% { opacity: 1; }
      73% { opacity: 0.7; }
      74% { opacity: 0.95; }
      88% { opacity: 1; }
      89% { opacity: 0.4; }
      90% { opacity: 1; }
    }

    @keyframes depth-breathe {
      from { transform: translateX(-50%) rotateX(58deg) scale(1); }
      to { transform: translateX(-50%) rotateX(58deg) scale(1.045); }
    }

    /* Soft clinical vignette / paper dust */
    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,0.35) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.35) 0 1px, transparent 2px);
      background-size: 120px 120px, 90px 90px, 160px 160px;
      mix-blend-mode: multiply;
    }

    /* —— Clinical document chrome —— */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .doc-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: rgba(243, 241, 232, 0.88);
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      backdrop-filter: blur(2px);
      opacity: 0;
      transform: translateY(-10px);
      animation: rise 0.7s var(--ease) 0.08s forwards;
    }

    .doc-meta {
      display: grid;
      gap: 4px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .doc-meta strong {
      color: var(--stamp);
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    .stamp {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1.5px solid var(--danger);
      padding: 6px 10px;
      align-self: center;
      transform: rotate(-3deg);
      opacity: 0;
      animation: stamp-in 0.55s var(--ease) 0.55s forwards;
    }

    .links {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .mono-link {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink-soft);
      border-bottom: 1px solid transparent;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .mono-link:hover {
      color: var(--stamp);
      border-color: var(--stamp);
    }

    .hero {
      display: grid;
      place-items: center;
      text-align: center;
      gap: clamp(16px, 3.5vh, 28px);
      padding: clamp(20px, 5vh, 48px) 12px;
    }

    .mark-wrap {
      width: min(36vw, 200px);
      aspect-ratio: 1;
      opacity: 0;
      transform: scale(0.9) translateY(16px);
      animation: rise 0.95s var(--ease) 0.2s forwards;
      filter: drop-shadow(0 8px 18px rgba(40, 34, 10, 0.35));
    }
    .mark-svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .mark-svg .frame { stroke: var(--ink); stroke-width: 7; fill: none; stroke-linejoin: round; }
    .mark-svg .inner { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linejoin: round; }
    .mark-svg .orbit {
      stroke: var(--stamp);
      stroke-width: 2.2;
      fill: none;
      opacity: 0.9;
      transform-origin: 60px 62px;
      animation: orbit-spin 11s linear infinite;
    }
    .mark-svg .orbit.alt { animation-duration: 15s; animation-direction: reverse; opacity: 0.55; }
    .mark-svg .link { stroke: var(--stamp); stroke-width: 2; fill: none; opacity: 0.85; }
    .mark-svg .node { fill: var(--stamp); }

    @keyframes orbit-spin { to { transform: rotate(360deg); } }

    .brand {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.6rem, 20vw, 10rem);
      letter-spacing: 0.12em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow:
        0 1px 0 rgba(243, 241, 232, 0.55),
        0 10px 28px rgba(40, 34, 10, 0.28);
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1s var(--ease) 0.32s forwards;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.85s var(--ease) 0.5s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--paper);
      background: var(--ink);
      border: 1.5px solid var(--ink);
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .cta:hover { transform: translateY(-2px); background: var(--stamp); border-color: var(--stamp); }
    .cta.ghost {
      color: var(--ink);
      background: rgba(243, 241, 232, 0.85);
      border-color: var(--ink);
    }
    .cta.ghost:hover {
      color: var(--paper);
      background: var(--ink);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: rgba(243, 241, 232, 0.82);
      border: 1px solid var(--rule);
      border-top-width: 2px;
      opacity: 0;
      animation: rise 0.7s var(--ease) 0.75s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(-8deg) scale(1.15); }
      to { opacity: 1; transform: rotate(-3deg) scale(1); }
    }

    @media (max-width: 640px) {
      .mark-wrap { width: min(48vw, 160px); }
      .brand { letter-spacing: 0.08em; }
      .cta-row { width: 100%; max-width: 320px; flex-direction: column; }
      .cta { width: 100%; }
      .doc-bar { flex-direction: column; }
      .stamp { align-self: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fluo-bar,
      .corridor-depth,
      .mark-svg .orbit,
      .doc-bar,
      .stamp,
      .mark-wrap,
      .brand,
      .cta-row,
      .foot { animation: none !important; }
      .doc-bar, .stamp, .mark-wrap, .brand, .cta-row, .foot {
        opacity: 1;
        transform: none;
      }
      .stamp { transform: rotate(-3deg); }
    }
  </style>
</head>
<body>
  <div class="corridor" aria-hidden="true">
    <div class="corridor-depth"></div>
    <div class="walls"></div>
    <div class="fluo-bar"></div>
    <div class="stain a"></div>
    <div class="stain b"></div>
    <div class="stain c"></div>
    <div class="dust"></div>
  </div>

  <div class="stage">
    <header class="doc-bar">
      <div class="doc-meta">
        <strong>Fichier clinique</strong>
        <span>Ref · ATLAS / CREATIF</span>
      </div>
      <span class="stamp" aria-hidden="true">Niveau 0</span>
      <nav class="links" aria-label="Navigation">
        <a class="mono-link" href="/">Atlas</a>
        <a class="mono-link" href="/#download">Télécharger</a>
      </nav>
    </header>

    <main class="hero" aria-label="Atlas">
      <div class="mark-wrap" aria-hidden="true">
        <svg class="mark-svg" viewBox="0 0 120 120">
          <path class="frame" d="M60 14 L102 98 H18 Z"/>
          <ellipse class="orbit" cx="60" cy="62" rx="34" ry="22"/>
          <ellipse class="orbit alt" cx="60" cy="62" rx="22" ry="34"/>
          <path class="inner" d="M60 48 L84 90 H36 Z"/>
          <path class="link" d="M42 58 L78 58 L60 88 Z"/>
          <circle class="node n1" cx="42" cy="58" r="4.2"/>
          <circle class="node n2" cx="78" cy="58" r="4.2"/>
          <circle class="node n3" cx="60" cy="88" r="4.2"/>
        </svg>
      </div>
      <h1 class="brand">Atlas</h1>
      <div class="cta-row">
        <a class="cta" href="/">Entrer</a>
        <a class="cta ghost" href="/#download">Télécharger</a>
      </div>
    </main>

    <footer class="foot">
      <span>Corridor — fluorescent</span>
      <span>atlas-secu.com</span>
    </footer>
  </div>
</body>
</html>
