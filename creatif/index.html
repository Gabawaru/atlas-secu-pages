<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas — Créatif</title>
  <meta name="description" content="Atlas — expérience visuelle créative.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Backrooms damp yellow — stained linoleum / wet plaster */
      --damp: #c9b85a;
      --damp-deep: #9a8a3c;
      --damp-wet: #b5a44a;
      --plaster: #d4c978;
      --floor: #a8943e;
      --fluo: #e8e2b0;
      --fluo-dim: rgba(232, 226, 176, 0.35);
      /* Clinical document */
      --paper: #f3f1e8;
      --ink: #1a1a18;
      --ink-soft: #3a3a34;
      --stamp: #1f4a3a;
      --rule: rgba(26, 26, 24, 0.28);
      --danger: #8b1e1e;
      --display: "Archivo Black", "Arial Black", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--mono);
      background: var(--damp-deep);
      overflow-x: hidden;
    }

    /* —— Full-bleed liminal corridor —— */
    .corridor {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 40% at 50% 14%, rgba(245, 241, 208, 0.42), transparent 62%),
        linear-gradient(180deg, #8a7c38 0%, var(--damp) 36%, var(--floor) 70%, #5a4c20 100%);
      perspective: 980px;
      perspective-origin: 50% 40%;
    }

    /* Endless floor plane — linoleum tiles toward vanishing point */
    .corridor-depth {
      position: absolute;
      left: 50%;
      top: 36%;
      width: 160vmax;
      height: 160vmax;
      transform: translateX(-50%) rotateX(62deg);
      transform-origin: 50% 0%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent calc(8% - 1.5px),
          rgba(70, 58, 18, 0.28) calc(8% - 1.5px),
          rgba(70, 58, 18, 0.28) 8%
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent calc(7% - 1.5px),
          rgba(55, 46, 14, 0.22) calc(7% - 1.5px),
          rgba(55, 46, 14, 0.22) 7%
        ),
        linear-gradient(180deg, var(--damp-wet), var(--floor) 45%, #6e5f28 100%);
      opacity: 0.95;
      animation: depth-breathe 16s var(--ease) infinite alternate;
    }

    /* Ceiling tile grid (inverse plane) */
    .ceiling {
      position: absolute;
      left: 50%;
      top: -8%;
      width: 140vmax;
      height: 55vh;
      transform: translateX(-50%) rotateX(-68deg);
      transform-origin: 50% 100%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent calc(11% - 1px),
          rgba(60, 52, 18, 0.2) calc(11% - 1px),
          rgba(60, 52, 18, 0.2) 11%
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent calc(14% - 1px),
          rgba(50, 42, 14, 0.16) calc(14% - 1px),
          rgba(50, 42, 14, 0.16) 14%
        ),
        linear-gradient(180deg, #7a6c32, #a89848);
      opacity: 0.55;
      pointer-events: none;
      animation: ceiling-drift 18s var(--ease) infinite alternate;
    }

    /* Vanishing doorway — liminal exit */
    .exit {
      position: absolute;
      left: 50%;
      top: 28%;
      width: min(12vw, 88px);
      height: min(22vh, 160px);
      transform: translate(-50%, -20%);
      background:
        linear-gradient(180deg, #2a2410 0%, #1a160c 55%, #0e0c06 100%);
      box-shadow:
        0 0 0 2px rgba(90, 78, 28, 0.45),
        0 0 40px 8px rgba(20, 16, 6, 0.35);
      opacity: 0.85;
      pointer-events: none;
      animation: exit-pulse 9s var(--ease) infinite;
    }

    /* Wet linoleum sheen under the fluo */
    .wet {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 52%;
      height: 38%;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(245, 241, 208, 0.08) 18%,
          rgba(245, 241, 208, 0.2) 42%,
          transparent 78%
        );
      filter: blur(0.5px);
      mix-blend-mode: soft-light;
      transform-origin: 50% 0%;
      animation: wet-sheen 7.5s var(--ease) infinite alternate;
    }

    /* Slow wall drip */
    .drip {
      position: absolute;
      width: 2px;
      border-radius: 1px;
      background: linear-gradient(180deg, rgba(70, 58, 18, 0.55), rgba(70, 58, 18, 0.05));
      pointer-events: none;
      opacity: 0.55;
      animation: drip-fall 8s linear infinite;
    }
    .drip.d1 { left: 16%; top: 10%; height: 18vh; animation-delay: 0s; }
    .drip.d2 { left: 78%; top: 14%; height: 14vh; animation-delay: 2.4s; width: 1.5px; }
    .drip.d3 { left: 34%; top: 8%; height: 11vh; animation-delay: 5.1s; opacity: 0.4; }

    .walls {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(55, 46, 14, 0.82) 0%, rgba(55, 46, 14, 0.35) 10%, transparent 22%, transparent 78%, rgba(55, 46, 14, 0.35) 90%, rgba(55, 46, 14, 0.82) 100%),
        linear-gradient(180deg, rgba(90, 78, 30, 0.4) 0%, transparent 30%);
      pointer-events: none;
    }

    /* Wall panel seams converging to exit */
    .seams {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(98deg, transparent 14%, rgba(60, 50, 16, 0.35) 14.2%, transparent 14.5%),
        linear-gradient(82deg, transparent 85.5%, rgba(60, 50, 16, 0.35) 85.8%, transparent 86%),
        linear-gradient(94deg, transparent 22%, rgba(60, 50, 16, 0.22) 22.15%, transparent 22.4%),
        linear-gradient(86deg, transparent 77.6%, rgba(60, 50, 16, 0.22) 77.85%, transparent 78%);
      opacity: 0.7;
    }

    /* Moisture stains */
    .stain {
      position: absolute;
      border-radius: 60% 40% 55% 45%;
      background: radial-gradient(ellipse at 40% 30%, rgba(70, 58, 18, 0.42), transparent 70%);
      filter: blur(1.5px);
      pointer-events: none;
    }
    .stain.a { width: 38vw; height: 28vh; left: -4%; top: 12%; opacity: 0.75; }
    .stain.b { width: 28vw; height: 22vh; right: -2%; top: 38%; opacity: 0.6; }
    .stain.c { width: 42vw; height: 18vh; left: 28%; bottom: 8%; opacity: 0.5; }

    /* Ambient fluorescent hum on the whole corridor wash */
    .hum {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 50% at 50% 12%, rgba(245, 241, 208, 0.16), transparent 70%);
      animation: hum-pulse 3.6s ease-in-out infinite;
      mix-blend-mode: soft-light;
    }

    /* Fluorescent strip + flicker */
    .fluo-bar {
      position: absolute;
      left: 22%;
      right: 22%;
      top: 5.5%;
      height: 8px;
      border-radius: 1px;
      background: linear-gradient(180deg, #f7f3d4, #c8c080);
      box-shadow:
        0 0 28px 10px rgba(232, 226, 176, 0.5),
        0 0 80px 24px rgba(200, 190, 110, 0.22),
        0 18px 60px 10px rgba(232, 226, 176, 0.12);
      animation: fluo-flicker 6.2s steps(1, end) infinite;
    }

    /* Slow damp haze */
    .haze {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 50% 30% at 30% 60%, rgba(200, 190, 120, 0.18), transparent 70%),
        radial-gradient(ellipse 45% 28% at 72% 45%, rgba(160, 148, 80, 0.14), transparent 65%);
      animation: haze-drift 22s linear infinite alternate;
      mix-blend-mode: soft-light;
      opacity: 0.85;
    }

    /* Clinical scan hairline */
    .scan {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      top: 0;
      background: linear-gradient(90deg, transparent, rgba(26, 26, 24, 0.22), transparent);
      pointer-events: none;
      animation: scan-sweep 11s var(--ease) infinite;
      opacity: 0;
    }

    @keyframes fluo-flicker {
      0%, 100% { opacity: 1; filter: brightness(1); }
      41% { opacity: 1; }
      42% { opacity: 0.62; filter: brightness(0.85); }
      43% { opacity: 1; filter: brightness(1.05); }
      68% { opacity: 1; }
      69% { opacity: 0.78; }
      70% { opacity: 0.95; }
      91% { opacity: 1; }
      92% { opacity: 0.35; filter: brightness(0.7); }
      93% { opacity: 1; filter: brightness(1); }
    }

    @keyframes depth-breathe {
      from { transform: translateX(-50%) rotateX(62deg) scale(1); }
      to { transform: translateX(-50%) rotateX(62deg) scale(1.055) translateY(-1.5%); }
    }

    @keyframes ceiling-drift {
      from { transform: translateX(-50%) rotateX(-68deg) scale(1); }
      to { transform: translateX(-50%) rotateX(-68deg) scale(1.03); }
    }

    @keyframes haze-drift {
      from { transform: translate3d(-2%, 1%, 0) scale(1); }
      to { transform: translate3d(3%, -2%, 0) scale(1.06); }
    }

    @keyframes scan-sweep {
      0% { transform: translateY(8vh); opacity: 0; }
      8% { opacity: 0.55; }
      92% { opacity: 0.4; }
      100% { transform: translateY(92vh); opacity: 0; }
    }

    @keyframes wet-sheen {
      from { opacity: 0.45; transform: scaleY(1) translateY(0); }
      to { opacity: 0.85; transform: scaleY(1.08) translateY(2%); }
    }

    @keyframes hum-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    @keyframes drip-fall {
      0% { transform: scaleY(0.35); opacity: 0; }
      12% { opacity: 0.55; }
      70% { transform: scaleY(1); opacity: 0.45; }
      100% { transform: scaleY(1.15) translateY(8%); opacity: 0; }
    }

    @keyframes exit-pulse {
      0%, 100% { opacity: 0.78; filter: brightness(0.95); }
      50% { opacity: 0.92; filter: brightness(1.05); }
    }

    /* Soft clinical vignette / paper dust */
    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,0.35) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.35) 0 1px, transparent 2px);
      background-size: 120px 120px, 90px 90px, 160px 160px;
      mix-blend-mode: multiply;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 40%, rgba(30, 24, 8, 0.45) 100%);
    }

    /* —— Clinical document chrome —— */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .doc-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(26, 26, 24, 0.04) 28px
        ),
        rgba(243, 241, 232, 0.9);
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
      backdrop-filter: blur(2px);
      opacity: 0;
      transform: translateY(-10px);
      animation: rise 0.7s var(--ease) 0.08s forwards;
    }

    .doc-meta {
      display: grid;
      gap: 4px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .doc-meta strong {
      color: var(--stamp);
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    .stamp {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1.5px solid var(--danger);
      padding: 6px 10px;
      align-self: center;
      transform: rotate(-3deg);
      opacity: 0;
      animation: stamp-in 0.55s var(--ease) 0.55s forwards;
    }

    .links {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .mono-link {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink-soft);
      border-bottom: 1px solid transparent;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .mono-link:hover {
      color: var(--stamp);
      border-color: var(--stamp);
    }

    .hero {
      display: grid;
      place-items: center;
      text-align: center;
      gap: clamp(16px, 3.5vh, 28px);
      padding: clamp(20px, 5vh, 48px) 12px;
    }

    .mark-wrap {
      width: min(36vw, 200px);
      aspect-ratio: 1;
      opacity: 0;
      transform: scale(0.9) translateY(16px);
      animation: rise 0.95s var(--ease) 0.2s forwards;
      filter: drop-shadow(0 8px 18px rgba(40, 34, 10, 0.35));
    }
    .mark-svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .mark-svg .frame { stroke: var(--ink); stroke-width: 7; fill: none; stroke-linejoin: round; }
    .mark-svg .inner { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linejoin: round; }
    .mark-svg .orbit {
      stroke: var(--stamp);
      stroke-width: 2.2;
      fill: none;
      opacity: 0.9;
      transform-origin: 60px 62px;
      animation: orbit-spin 11s linear infinite;
    }
    .mark-svg .orbit.alt { animation-duration: 15s; animation-direction: reverse; opacity: 0.55; }
    .mark-svg .link { stroke: var(--stamp); stroke-width: 2; fill: none; opacity: 0.85; }
    .mark-svg .node { fill: var(--stamp); }

    @keyframes orbit-spin { to { transform: rotate(360deg); } }

    .brand {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.6rem, 20vw, 10rem);
      letter-spacing: 0.12em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow:
        0 1px 0 rgba(243, 241, 232, 0.55),
        0 10px 28px rgba(40, 34, 10, 0.28);
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1s var(--ease) 0.32s forwards;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.85s var(--ease) 0.5s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--paper);
      background: var(--ink);
      border: 1.5px solid var(--ink);
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .cta:hover { transform: translateY(-2px); background: var(--stamp); border-color: var(--stamp); }
    .cta.ghost {
      color: var(--ink);
      background: rgba(243, 241, 232, 0.85);
      border-color: var(--ink);
    }
    .cta.ghost:hover {
      color: var(--paper);
      background: var(--ink);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: rgba(243, 241, 232, 0.88);
      border: 1px solid var(--rule);
      border-top-width: 2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
      opacity: 0;
      animation: rise 0.7s var(--ease) 0.75s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(-8deg) scale(1.15); }
      to { opacity: 1; transform: rotate(-3deg) scale(1); }
    }

    @media (max-width: 640px) {
      .mark-wrap { width: min(48vw, 160px); }
      .brand { letter-spacing: 0.08em; }
      .cta-row { width: 100%; max-width: 320px; flex-direction: column; }
      .cta { width: 100%; }
      .doc-bar { flex-direction: column; }
      .stamp { align-self: flex-start; }
      .exit { width: min(18vw, 72px); height: min(18vh, 120px); top: 30%; }
      .wet { left: 10%; right: 10%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fluo-bar,
      .corridor-depth,
      .ceiling,
      .haze,
      .scan,
      .wet,
      .hum,
      .drip,
      .exit,
      .mark-svg .orbit,
      .doc-bar,
      .stamp,
      .mark-wrap,
      .brand,
      .cta-row,
      .foot { animation: none !important; }
      .doc-bar, .stamp, .mark-wrap, .brand, .cta-row, .foot {
        opacity: 1;
        transform: none;
      }
      .stamp { transform: rotate(-3deg); }
      .haze { opacity: 0.5; }
      .wet, .hum { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div class="corridor" aria-hidden="true">
    <div class="ceiling"></div>
    <div class="corridor-depth"></div>
    <div class="exit"></div>
    <div class="walls"></div>
    <div class="seams"></div>
    <div class="hum"></div>
    <div class="fluo-bar"></div>
    <div class="wet"></div>
    <div class="drip d1"></div>
    <div class="drip d2"></div>
    <div class="drip d3"></div>
    <div class="stain a"></div>
    <div class="stain b"></div>
    <div class="stain c"></div>
    <div class="haze"></div>
    <div class="dust"></div>
    <div class="vignette"></div>
    <div class="scan"></div>
  </div>

  <div class="stage">
    <header class="doc-bar">
      <div class="doc-meta">
        <strong>Fichier clinique</strong>
        <span>Ref · ATLAS / CREATIF</span>
      </div>
      <span class="stamp" aria-hidden="true">Niveau 0</span>
      <nav class="links" aria-label="Navigation">
        <a class="mono-link" href="/">Atlas</a>
        <a class="mono-link" href="/#download">Télécharger</a>
      </nav>
    </header>

    <main class="hero" aria-label="Atlas">
      <div class="mark-wrap" aria-hidden="true">
        <svg class="mark-svg" viewBox="0 0 120 120">
          <path class="frame" d="M60 14 L102 98 H18 Z"/>
          <ellipse class="orbit" cx="60" cy="62" rx="34" ry="22"/>
          <ellipse class="orbit alt" cx="60" cy="62" rx="22" ry="34"/>
          <path class="inner" d="M60 48 L84 90 H36 Z"/>
          <path class="link" d="M42 58 L78 58 L60 88 Z"/>
          <circle class="node n1" cx="42" cy="58" r="4.2"/>
          <circle class="node n2" cx="78" cy="58" r="4.2"/>
          <circle class="node n3" cx="60" cy="88" r="4.2"/>
        </svg>
      </div>
      <h1 class="brand">Atlas</h1>
      <div class="cta-row">
        <a class="cta" href="/">Entrer</a>
        <a class="cta ghost" href="/#download">Télécharger</a>
      </div>
    </main>

    <footer class="foot">
      <span>Corridor — fluorescent</span>
      <span>atlas-secu.com</span>
    </footer>
  </div>
</body>
</html>
