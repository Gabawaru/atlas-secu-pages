<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas — Créatif</title>
  <meta name="description" content="Atlas — moodboard créatif produit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Warm calm product-lab — not medical, not horror */
      --bg: #f2efe6;
      --bg-soft: #e8e3d6;
      --ink: #1e2a2e;
      --ink-soft: #44555a;
      --muted: #6d7c80;
      --teal: #2f8f8a;
      --teal-deep: #1f6f6b;
      --display: "Archivo Black", "Arial Black", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--mono);
      background: var(--bg);
      overflow-x: hidden;
    }

    .field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 100% 70% at 50% 0%, rgba(255, 252, 245, 0.85), transparent 58%),
        radial-gradient(ellipse 80% 50% at 80% 90%, rgba(47, 143, 138, 0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 12% 70%, rgba(180, 160, 110, 0.12), transparent 55%),
        linear-gradient(168deg, #faf7f0 0%, var(--bg) 48%, var(--bg-soft) 100%);
    }

    .field::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(47, 143, 138, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47, 143, 138, 0.14) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 18%, transparent 70%);
      animation: grid-drift 40s linear infinite;
    }

    @keyframes grid-drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 56px 28px, 28px 56px; }
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      animation: rise 0.7s var(--ease) 0.06s forwards;
    }

    .mono-link {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink-soft);
      border-bottom: 1px solid transparent;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .mono-link:hover {
      color: var(--teal-deep);
      border-color: var(--teal);
    }

    .hero {
      display: grid;
      place-items: center;
      text-align: center;
      gap: clamp(16px, 3.5vh, 28px);
      padding: clamp(16px, 4vh, 40px) 12px;
    }

    .mark-wrap {
      width: min(36vw, 200px);
      aspect-ratio: 1;
      opacity: 0;
      transform: scale(0.92) translateY(14px);
      animation: rise 0.9s var(--ease) 0.16s forwards;
      filter: drop-shadow(0 8px 20px rgba(30, 42, 46, 0.1));
    }
    .mark-svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .mark-svg .frame { stroke: var(--ink); stroke-width: 7; fill: none; stroke-linejoin: round; }
    .mark-svg .inner { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linejoin: round; }
    .mark-svg .orbit {
      stroke: var(--teal);
      stroke-width: 2.2;
      fill: none;
      opacity: 0.9;
      transform-origin: 60px 62px;
      animation: orbit-spin 14s linear infinite;
    }
    .mark-svg .orbit.alt { animation-duration: 18s; animation-direction: reverse; opacity: 0.55; }
    .mark-svg .link { stroke: var(--teal); stroke-width: 2; fill: none; opacity: 0.85; }
    .mark-svg .node { fill: var(--teal); }

    @keyframes orbit-spin { to { transform: rotate(360deg); } }

    .brand {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.6rem, 20vw, 10rem);
      letter-spacing: 0.12em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 0.95s var(--ease) 0.28s forwards;
    }

    .lede {
      margin: 0;
      max-width: 28ch;
      font-size: clamp(0.72rem, 2vw, 0.85rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.85s var(--ease) 0.4s forwards;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.85s var(--ease) 0.5s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: var(--teal);
      border: 1.5px solid var(--teal-deep);
      transition: background 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .cta:hover {
      transform: translateY(-2px);
      background: var(--teal-deep);
    }
    .cta.ghost {
      color: var(--ink);
      background: rgba(255, 252, 245, 0.75);
      border-color: rgba(30, 42, 46, 0.28);
    }
    .cta.ghost:hover {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.7s var(--ease) 0.6s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      .mark-wrap { width: min(48vw, 160px); }
      .brand { letter-spacing: 0.08em; }
      .cta-row { width: 100%; max-width: 320px; flex-direction: column; }
      .cta { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .field::before,
      .mark-svg .orbit,
      .top,
      .mark-wrap,
      .brand,
      .lede,
      .cta-row,
      .foot { animation: none !important; }
      .top, .mark-wrap, .brand, .lede, .cta-row, .foot {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div class="stage">
    <header class="top">
      <a class="mono-link" href="/">Atlas</a>
      <a class="mono-link" href="/#download">Télécharger</a>
    </header>

    <main class="hero" aria-label="Atlas">
      <div class="mark-wrap" aria-hidden="true">
        <svg class="mark-svg" viewBox="0 0 120 120">
          <path class="frame" d="M60 14 L102 98 H18 Z"/>
          <ellipse class="orbit" cx="60" cy="62" rx="34" ry="22"/>
          <ellipse class="orbit alt" cx="60" cy="62" rx="22" ry="34"/>
          <path class="inner" d="M60 48 L84 90 H36 Z"/>
          <path class="link" d="M42 58 L78 58 L60 88 Z"/>
          <circle class="node n1" cx="42" cy="58" r="4.2"/>
          <circle class="node n2" cx="78" cy="58" r="4.2"/>
          <circle class="node n3" cx="60" cy="88" r="4.2"/>
        </svg>
      </div>
      <h1 class="brand">Atlas</h1>
      <p class="lede">Créatif · lab produit</p>
      <div class="cta-row">
        <a class="cta" href="/">Entrer</a>
        <a class="cta ghost" href="/#download">Télécharger</a>
      </div>
    </main>

    <footer class="foot">
      <span>Moodboard</span>
      <span>atlas-secu.com</span>
    </footer>
  </div>
</body>
</html>
